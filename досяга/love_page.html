<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Жаным, люблю тебя</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(120deg, #2d1375, #afe2fa);
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      font-size: 3em;
      color: #fff;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .caption {
      font-size: 1.5em;
      color: #fff;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
      margin-top: 10px;
      z-index: 1;
    }

    .heart {
      position: fixed;
      top: -50px;
      width: 20px;
      height: 20px;
      background-color: pink;
      animation: fall 6s linear infinite;
      opacity: 0.8;
      transform: rotate(45deg);
      z-index: 0;
    }

    .heart::before,
    .heart::after {
      content: '';
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: pink;
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      left: -10px;
      top: 0;
    }

    @keyframes fall {
      0% {
        transform: translateY(-100px) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 0;
      }
    }

    #heart-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      font-size: 2em;
      cursor: pointer;
      animation: pulse 2s infinite;
      z-index: 1000;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.2); }
      100% { transform: scale(1); }
    }

    #message-modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 1001;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 30px;
      border-radius: 15px;
      text-align: center;
      max-width: 80%;
      font-size: 1.2em;
    }
    .modal-content button {
      margin-top: 20px;
      padding: 10px 20px;
      background: #2d1375;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Жаным, люблю тебя</h1>

  <div class="caption">Ты — моё счастье, моё солнце и моё всё 💗</div>

  <!-- Сердечко-сюрприз -->
  <div id="heart-button">❤️</div>

  <!-- Сообщение -->
  <div id="message-modal">
    <div class="modal-content">
      <p>Ты — самое ценное, что у меня есть. Я благодарен за каждый момент с тобой. 💖</p>
      <button onclick="closeMessage()">Закрыть</button>
    </div>
  </div>

  <!-- Музыка -->
  <audio autoplay loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
    Твой браузер не поддерживает аудио.
  </audio>

  <!-- Сердечки -->
  <script>
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('heart');
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = 2 + Math.random() * 3 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 300);
  </script>

  <!-- Сообщение при клике -->
  <script>
    const heartBtn = document.getElementById("heart-button");
    const modal = document.getElementById("message-modal");

    heartBtn.onclick = () => {
      modal.style.display = "flex";
    };

    function closeMessage() {
      modal.style.display = "none";
    }
  </script>
</body>
</html>
